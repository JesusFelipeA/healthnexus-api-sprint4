# Producción con la base en Amazon RDS (la misma que usa la plataforma web).
# Solo levanta la API: no hay contenedor de MySQL.
#   docker compose -f docker-compose.rds.yml --env-file .env.rds up -d --build
# La API escucha solo en 127.0.0.1:3000; Nginx del servidor es la entrada HTTPS.
# Con COMPOSE_PROFILES=observabilidad en .env.rds también levanta Grafana Alloy (ver observabilidad/README.md).
services:
  api:
    build:
      context: .
      target: prod
    image: healthnexus-api:${TAG:-latest}
    container_name: healthnexus-api
    restart: unless-stopped
    environment:
      PORT: "3000"
      DB_HOST: ${DB_HOST:?Falta DB_HOST (endpoint de RDS) en .env.rds}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?Falta DB_NAME}
      DB_USER: ${DB_USER:?Falta DB_USER}
      DB_PASS: ${DB_PASS:?Falta DB_PASS}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET}
      JWT_EXPIRES: ${JWT_EXPIRES:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      API_DOCS: ${API_DOCS:-1}
      # Notificaciones push (opcional): cuenta de servicio de Firebase en base64
      FIREBASE_CREDENTIALS_BASE64: ${FIREBASE_CREDENTIALS_BASE64:-}
      # Recuperación de contraseña por correo (opcional; sin SMTP_HOST no se envían correos)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Observabilidad (opcional): vacío = apagada. Con Alloy: http://alloy:4318
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: healthnexus-api
      OTEL_SERVICE_VERSION: ${TAG:-latest}
      OTEL_AMBIENTE: ${OTEL_AMBIENTE:-produccion}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Agente de Grafana: recibe trazas y métricas de la API y mide el servidor. Solo con el perfil "observabilidad".
  alloy:
    image: grafana/alloy:v1.11.3
    container_name: healthnexus-alloy
    profiles: ["observabilidad"]
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT:-}
      GRAFANA_CLOUD_INSTANCE_ID: ${GRAFANA_CLOUD_INSTANCE_ID:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
    volumes:
      - ./observabilidad/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    # Sin puertos publicados: solo la API le habla, por la red interna de Compose
    read_only: true
    tmpfs: ["/var/lib/alloy", "/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 200m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
